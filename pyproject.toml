[project]
name = "api-squash"
version = "0.2.0"
description = "Extract Python API surfaces in a compact, token-efficient format"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.scripts]
api-squash = "api_squash.cli:cli"

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_squash"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4",
]
bench = [
    "django>=5.2.13",
    "fastapi>=0.135.3",
    "flask>=3.1.3",
    "requests>=2.33.1",
]

[tool.pytest.ini_options]
markers = [
    "benchmark: heavyweight benchmark tests (require bench dependency group)",
]
